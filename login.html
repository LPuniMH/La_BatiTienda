<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · La BatiTienda</title>

    <!--CSS BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">

    <!--Estilos CSS del sitio-->
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/styles.css">
    <!--Estilos propios del login-->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- Barra de Navegación -->
    <div id="nav-batitienda"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="login-main d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="login-card mx-auto">

                <img class="login-logo" src="https://cdn-icons-png.flaticon.com/512/1841/1841015.png" alt="Logo La BatiTienda">

                <h1 class="login-title">Iniciar sesión</h1>
                <p class="login-subtitle">Entra a tu cuenta para seguir comprando en la Baticueva</p>

                <form class="login-form" id="loginForm" novalidate>

                    <div class="mb-1 text-start">
                        <label for="usuario" class="form-label login-label">Correo electrónico</label>
                        <input type="text" id="usuario" name="usuario" class="form-control login-input"
                            placeholder="bruce.wayne@wayneenterprises.com" autocomplete="username">
                        <p class="login-error" id="errorUsuario"></p>
                    </div>

                    <div class="mb-1 text-start">
                        <label for="password" class="form-label login-label">Contraseña</label>
                        <div class="login-password-wrapper">
                            <input type="password" id="password" name="password" class="form-control login-input"
                                placeholder="••••••••" autocomplete="current-password">
                            <button type="button" class="login-toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
                                <span class="material-symbols-outlined" id="iconoTogglePassword">visibility</span>
                            </button>
                        </div>
                        <p class="login-error" id="errorPassword"></p>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3 login-options">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="recordar" name="recordar">
                            <label class="form-check-label" for="recordar">Recordarme</label>
                        </div>
                        <a href="#" class="login-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <p class="login-feedback" id="loginFeedback"></p>

                    <button type="submit" class="btn w-100 login-btn" id="botonIngresar">Ingresar</button>

                </form>

                <p class="login-signup-text">
                    ¿No tienes cuenta? <a href="#" class="login-link">Regístrate</a>
                </p>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-batitienda"></div>

    <script src="js/contenedores.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
