<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>

    <!--CSS BOOTSRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">

    <!--Estilos CSS-->
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Barra de Navegación -->
    

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <div
            class="toolbar-productos d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div>
                <h1 class="h3 mb-0">Nuestro catálogo</h1>
                <p class="text-muted small mb-0">Kuromi, anime, figuras, peluches y superhéroes</p>
            </div>
            <div class="d-flex flex-column flex-sm-row align-items-sm-center gap-2">
                <input type="text" id="buscarProducto" class="form-control" placeholder="Buscar producto...">
                <select id="filtroCategoria" class="form-select" style="min-width: 220px;">
                    <option value="todos">Filtros</option>
                </select>
            </div>
        </div>

        <!-- Acá van a aparecer las cajas de productos -->
        <div id="contenedorProductos"></div>
    </main>

    <!-- Footer -->
    
    
    <script src="js/productos.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
