<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>

    <!--CSS BOOTSRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">

    <!--Estilos CSS-->
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Barra de Navegación -->
    <div id="nav-batitienda"></div>
    

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenedor-principal">
        <div class="toolbar-productos d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div>
                <h1 id="tituloCatalogo" class="h3 mb-0">Nuestro catálogo</h1>
                <p id="descCatalogo" class="peque-desc mb-0">Kuromi, anime, figuras, peluches y superhéroes</p>
            </div>
            <div class="d-flex flex-column flex-sm-row align-items-sm-center gap-2">
                <input type="text" id="buscarProducto" class="form-control" placeholder="Buscar producto...">
                <select id="filtroCategoria" class="form-select" style="min-width: 220px;">
                    <option value="todos">Categorías</option>
                </select>
                <button class="btn btn-outline-warning d-flex align-items-center" data-bs-toggle="modal" data-bs-target="#modalFiltrosPrecio" aria-label="Filtros de precio">
                    <span class="material-symbols-outlined">attach_money</span>
                </button>
            </div>
        </div>

        <div id="contenedorProductos"></div>
    </main>

    <div class="modal fade" id="modalFiltrosPrecio" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom bg-dark text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-amarillo fw-bold">Filtros de Precio</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Precio Mínimo ($)</label>
                        <input type="number" id="minPrecio" class="form-control bg-dark text-white border-amarillo" min="0" step="500" value="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Precio Máximo ($)</label>
                        <input type="number" id="maxPrecio" class="form-control bg-dark text-white border-amarillo" min="0" max="5000000" step="500" value="5000000">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Ordenar por precio</label>
                        <select id="ordenPrecio" class="form-select bg-dark text-white border-amarillo">
                            <option value="ninguno">Relevancia</option>
                            <option value="asc">De Menor a Mayor</option>
                            <option value="desc">De Mayor a Menor</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning fw-bold" id="btnGuardarFiltros">Aplicar Filtros</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content modal-content-custom bg-dark text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-amarillo fw-bold" id="modalProdTitulo">Cargando...</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="position-relative">
                                <button class="btn-wishlist" id="modalBtnWishlist" data-codigo="" aria-label="Añadir a lista de deseos">
                                    <span class="material-symbols-outlined">star</span>
                                </button>
                                <div id="modalProdImagenContenedor" class="modal-img-producto"></div>
                            </div>
                        </div>
                        <div class="col-md-6 d-flex flex-column">
                            <span class="card-categoria align-self-start" id="modalProdCategoria">Categoría</span>
                            
                            <p class="mt-3 mb-1 small text-white"><span class="fw-bold">Código:</span> <span id="modalProdCodigo" class="fw-normal"></span></p>
                            <p class="mb-1 small text-white"><span class="fw-bold">Marca:</span> <span id="modalProdMarca" class="fw-normal"></span></p>
                            <p class="mb-3 small text-white"><span class="fw-bold">Modelo:</span> <span id="modalProdModelo" class="fw-normal"></span></p>
                            
                            <h4 class="text-amarillo fw-bold mb-3" id="modalProdPrecio">$0</h4>
                            <p id="modalProdDesc" class="flex-grow-1">Descripción del producto</p>
                            
                            <div class="mt-auto">
                                <p class="small mb-2" id="modalProdStock">Stock disponible: 0</p>
                                <button class="btn-agregar w-100" id="modalBtnCarrito" data-codigo="">Agregar al carrito</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container-fixed">
        <div id="toastNotificacion" class="toast-custom d-flex align-items-center">
            <span class="material-symbols-outlined me-2 text-amarillo">info</span>
            <span id="toastMensaje"></span>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-batitienda"></div>
    
    <script src="js/categorias.js"></script>
    <script src="js/productos.js"></script>
    <script type="module" src="js/catalogo.js"></script>
    <script src="js/contenedores.js"></script>
    <script type="module" src="js/nav.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
