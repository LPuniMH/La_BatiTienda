<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La BatiTienda</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1841/1841015.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/styles.css">
    
</head>
<body>

    <!-- Barra de Navegación -->
    <div id="nav-batitienda"></div>

    <!-- Contenido de la Página Principal -->
    <main class="contenedor-principal" id="contenedorInicio">
    </main>

    <!-- Footer -->
    <div id="footer-batitienda"></div>

    <script src="js/categorias.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/inicio.js"></script>
    <script src="js/contenedores.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const intervaloNav = setInterval(() => {
            const enlaces = document.querySelectorAll('.main-navigation .nav-link');
            if (enlaces.length > 0) {
                clearInterval(intervaloNav);
                enlaces.forEach(enlace => {
                    if (enlace.getAttribute('href') === 'index.html') {
                        enlace.classList.add('active');
                    }
                });
            }
        }, 100);
    </script>
</body>
</html>
